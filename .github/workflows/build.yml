name: iOS build

# Manual only. Starts a native build on EAS and lists recent builds with their
# runtime version (native-1, native-2, ...). An OTA update only reaches builds
# whose runtime version matches app.json.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (production = her phone, preview = yours)'
        required: true
        default: production
        type: choice
        options: [production, preview]
      list_only:
        description: 'Only list recent builds, do not start a new one'
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.event.inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Runtime version still matches the native layer
        run: node scripts/check-runtime.mjs
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start build
        if: ${{ github.event.inputs.list_only != 'true' }}
        # Inputs pass through env, never interpolated into the script.
        env:
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          RUNTIME=$(jq -r .expo.runtimeVersion app.json)
          eas build --profile "$PROFILE" --platform ios --non-interactive --no-wait --message "$RUNTIME · $PROFILE"
      - name: Recent builds
        run: |
          eas build:list --platform ios --limit 6 --json --non-interactive > builds.json
          echo "created | profile | channel | runtime | status | message"
          jq -r 'def s: if type == "object" then (.name // .version // .runtimeVersion // tojson) elif . == null then "-" else tostring end;
                 .[] | [.createdAt[0:16], .buildProfile, (.updateChannel | s), (.runtime | s), .status, (.message | s)] | join(" | ")' builds.json
      - name: Why recent builds failed
        run: |
          for id in $(jq -r '.[] | select(.status == "ERRORED") | .id' builds.json | head -3); do
            echo "::group::Build $id"
            eas build:view "$id" --json --non-interactive > view.json || true
            jq -r '"error: \(.error.errorCode // "-") \(.error.message // "-")"' view.json || true
            for url in $(jq -r '(.logFiles // [])[]' view.json); do
              curl -sL "$url" -o log.txt || continue
              grep -a -i -E "error|failed|❌" log.txt | grep -a -v -i "warning" | tail -40 || true
            done
            echo "::endgroup::"
          done
