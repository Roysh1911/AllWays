name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity. This makes one
# tiny read-only request a day, so the project never pauses, even if both
# phones are offline for a while. Uses only the public (publishable) key.
on:
  schedule:
    - cron: '23 6 * * *' # daily 06:23 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" src/lib/config.ts | head -1)
          KEY=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" src/lib/config.ts | head -1)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $CODE"
          test "$CODE" = "200"
