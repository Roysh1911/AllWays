name: Database migrations

# Applies new files in supabase/migrations to the Supabase project,
# only after the security tests pass.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: db
  cancel-in-progress: false

jobs:
  migrate:
    # Off until the secrets exist: set repository variable DB_ENABLED=true to enable.
    if: vars.DB_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Security tests (RLS)
        working-directory: supabase/tests
        run: npm install --silent && npm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - run: supabase db push --remote
