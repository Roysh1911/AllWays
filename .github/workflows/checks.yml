name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Runtime version still matches the native layer
        run: node scripts/check-runtime.mjs
      - run: npx eslint .
      - run: npm test
      - name: Security tests (RLS) against an in-memory Postgres
        run: npm run test:rls
