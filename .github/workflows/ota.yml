name: OTA update

# Every push to main goes to the "preview" channel (the owner's phone).
# Promote to "production" (her phone) by running this workflow manually.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'supabase/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel'
        required: true
        default: preview
        type: choice
        options: [preview, production]

concurrency:
  group: ota-${{ github.event.inputs.channel || 'preview' }}
  cancel-in-progress: false

jobs:
  update:
    # Off until the secrets exist: set repository variable OTA_ENABLED=true to enable.
    if: vars.OTA_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish update
        # Values pass through env, never interpolated into the script (no injection).
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'preview' }}
          MESSAGE: ${{ github.event.head_commit.message || 'manual update' }}
        run: eas update --channel "$CHANNEL" --message "$MESSAGE" --platform ios --non-interactive
