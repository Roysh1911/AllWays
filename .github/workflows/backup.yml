name: Weekly encrypted backup

# Dumps the data with the read-only backup_reader role, encrypts it with a
# passphrase only the owner knows, and keeps it as a workflow artifact.
# Restore: download the artifact, then
#   gpg --decrypt backup.sql.gpg > backup.sql
on:
  schedule:
    - cron: '17 2 * * 0' # Sundays 02:17 UTC
  workflow_dispatch:

jobs:
  backup:
    # Off until the secrets exist: set repository variable BACKUP_ENABLED=true to enable.
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dump (data only, public schema)
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
        run: |
          docker run --rm -e BACKUP_DB_URL postgres:17 \
            sh -c 'pg_dump "$BACKUP_DB_URL" --data-only --schema=public --no-owner' > backup.sql
          test -s backup.sql
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o backup.sql.gpg backup.sql
          shred -u backup.sql
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup.sql.gpg
          retention-days: 90
