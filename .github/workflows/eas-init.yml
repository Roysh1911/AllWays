name: Register project on Expo (one-time)

# Creates the Expo project for this app and prints its projectId,
# so it can be committed to app.json. Safe to re-run: it reuses the project.
on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas whoami
      - run: eas init --non-interactive --force
      - name: Show result
        run: |
          echo "PROJECT_ID=$(node -e "console.log(require('./app.json').expo.extra?.eas?.projectId ?? 'missing')")"
          git diff app.json
